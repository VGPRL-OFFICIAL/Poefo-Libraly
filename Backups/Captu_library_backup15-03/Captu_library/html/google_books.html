<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Livros - Poefo Library</title>
    <link rel="icon" href="../images/Logo_Poefo.png" type="image/png">
    <link rel="stylesheet" href="../style/style_google_books.css">
</head>
<body>
    <div class="main-screen">
        <div id="status"></div>

        <div class="header-bar app-header">
            <img src="../images/icon_logo.png" alt="Enviar" class="logo">
            <span class="app-title">Poefo Library</span>
            <div>
              
            </div>
        </div>
        

        <div class="search-bar">
            <div class="search-input">
                 <img src="../images/search.png" alt="search" class="img_geral">
                <input type="text" id="search-input" placeholder="Pesquisar livros..." class="search-field">
                <button id="search-btn" class="search-btn">Buscar</button>
            </div>
        </div>

        <div class="genres-bar">
            <span class="genre-title">Gêneros:</span>
            <div class="genres-list">
                <button class="genre-btn" data-genre="fiction">Ficção</button>
                <button class="genre-btn" data-genre="romance">Romance</button>
                <button class="genre-btn" data-genre="mystery">Mistério</button>
                <button class="genre-btn" data-genre="science fiction">Ficção Científica</button>
                <button class="genre-btn" data-genre="fantasy">Fantasia</button>
                <button class="genre-btn" data-genre="biography">Biografia</button>
                <button class="genre-btn" data-genre="history">História</button>
                <button class="genre-btn" data-genre="self-help">Autoajuda</button>
            </div>
        </div>
        
        <div class="section-header">
            <span class="section-title">Resultados da Pesquisa</span>
        </div>
        <div class="book-list scroll-list" id="search-results-list"></div>

        <div class="section-header">
            <span class="section-title">Livros Populares</span>
        </div>
        <div class="book-list scroll-list" id="popular-books-list"></div>

        <div class="section-header">
            <span class="section-title">Lançamentos Recentes</span>
        </div>
        <div class="carousel-container">
            <div class="carousel-list" id="recent-books-container"> 
            </div>
        </div>

        <a href="./publicador.html" class="fab">
            <img src="../images/ic_edition.png" class="edit-icon">
        </a>
        
    </div>

    <div class="nav-bar">
        <a href="./games.html" class="nav-item">
            <img src="../images/ic_game.png" alt="Game" class="nav-icon">
            <span>Games</span>
        </a>
        <a href="./editor.html" class="nav-item">
            <img src="../images/ic_edition.png" alt="Edition" class="nav-icon">
            <span>Criar</span>
        </a>
        <a href="./home.html" class="nav-item">
            <img src="../images/ic_home.png" alt="Home" class="nav-icon">
            <span>Inicio</span>
        </a>
        <a href="./feed.html" class="nav-item">
            <img src="../images/ic_cloud_off_white.png" alt="Feed" class="nav-icon">
            <span>Feed</span>
        </a>
        <a href="./google_books.html" class="nav-item nav-item-active">
            <img src="../images/ic_home.png" alt="Google Books" class="nav-icon nav-icon-active">
            <span>Google</span>
        </a>
    </div>

    <div class="home-indicator"></div>
    <script src="../scripts/script_google_books.js"></script>
</body>
</html>
