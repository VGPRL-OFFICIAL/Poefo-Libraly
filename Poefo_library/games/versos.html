<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scribe - O Enigma</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/style_theme.css">
    <style>
        :root {
            --bg-page: #f9f6f0;
            --accent-soft: #b8ced2;
            --text-main: #3d3d3d; 
            --card-white: #ffffff;
            --gold: #d4af37;
            --error: #d9534f;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
        }

        .reader-container {
            background-color: var(--card-white);
            width: 100%; max-width: 550px; padding: 2.5rem; border-radius: 30px;
            border: 1px solid var(--accent-soft);
            box-shadow: 0 15px 35px rgba(184, 206, 210, 0.2);
            text-align: center; position: relative;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        .theme-indicator {
            display: inline-block;
            background: var(--accent-soft);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        h1 { font-family: 'Playfair Display', serif; font-size: 2rem; margin: 0 0 10px 0; }
        
        .btn {
            background-color: var(--accent-soft); color: white; border: none;
            padding: 12px 25px; border-radius: 12px; font-weight: 600;
            cursor: pointer; transition: 0.2s; width: 100%; margin-bottom: 10px;
            font-family: 'Inter';
        }
        .btn:hover { background-color: #a4bcc1; transform: scale(1.01); }
        .btn-danger { background-color: transparent; color: #a0a0a0; border: 1px solid #ddd; font-size: 0.8rem; margin-top: 15px; }
        .btn-danger:hover { color: var(--error); border-color: var(--error); background: #fff5f5; }

        .status-bar { display: flex; justify-content: space-between; margin: 15px 0; font-size: 0.75rem; color: #888; font-weight: bold; }

        .hint-box { 
            background: #f0f4f5; padding: 15px; border-radius: 15px; margin-bottom: 20px; 
            text-align: left; border: 1px dashed var(--accent-soft); font-size: 0.85rem; line-height: 1.4;
        }

        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 15px; border: 1.5px solid #eee; border-radius: 12px; outline: none; background: #fafafa; }
        
        .ranking-container { max-height: 200px; overflow-y: auto; border-top: 1px solid #eee; padding-top: 15px; }
        .ranking-item { padding: 10px; border-radius: 10px; border: 1px solid #f0f0f0; margin-bottom: 8px; text-align: left; }
        .ranking-item.top-match { background: #e8f5e9; border-color: #c8e6c9; }
        
        .progress-bar { height: 4px; background: #eee; width: 100%; margin-top: 8px; border-radius: 2px; }
        .progress-fill { height: 100%; background: var(--accent-soft); border-radius: 2px; transition: width 0.6s ease; }

        .score-display { font-size: 2.5rem; font-family: 'Playfair Display'; color: var(--gold); margin: 15px 0; }
        
        .records { font-size: 0.75rem; color: #999; margin-top: 20px; text-align: left; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>

    <div class="reader-container">
        <div class="theme-indicator">Tema: Literatura & Escrita</div>
        
        <div id="menu-screen" class="screen active">
            <h1>Scribe</h1>
            <p style="color: #888; margin-bottom: 25px;">Escolha o rigor da sua investigação:</p>
            <button class="btn" onclick="initGame('facil')">NÍVEL FÁCIL</button>
            <button class="btn" onclick="initGame('medio')">NÍVEL MÉDIO</button>
            <button class="btn" onclick="initGame('dificil')">NÍVEL DIFÍCIL</button>
            
            <div class="records" id="high-scores">
                <strong>MELHORES PONTUAÇÕES:</strong><br>
                Fácil: <span id="record-facil">0</span> | Médio: <span id="record-medio">0</span> | Difícil: <span id="record-dificil">0</span>
            </div>
            <button class="btn btn-danger" onclick="window.location.href='index.html'" style="border:none; background:none;">Voltar ao Menu Principal</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="status-bar">
                <span id="diff-label"></span>
                <span id="tries-label"></span>
            </div>
            
            <div class="hint-box" id="hint-area">
                <strong>Pista:</strong> <span id="hint-text">...</span>
            </div>

            <div class="input-group">
                <input type="text" id="guess-input" placeholder="Tente uma palavra..." autocomplete="off">
                <button class="btn" style="width: auto; margin:0" onclick="handleGuess()">Investigar</button>
            </div>

            <div class="ranking-container" id="ranking-list"></div>

            <button class="btn btn-danger" onclick="giveUp()">Desistir desta obra</button>
        </div>

        <div id="result-screen" class="screen">
            <h1 id="result-title">Vitória</h1>
            <div class="score-display" id="final-score-val">0</div>
            <p id="result-desc" style="font-style: italic; margin-bottom: 20px;"></p>
            <div id="stats-detail" style="font-size: 0.9rem; color: #666; margin-bottom: 25px;"></div>
            <button class="btn" onclick="showMenu()">Nova Edição</button>
            <button class="btn btn-danger" onclick="window.location.href='index.html'" style="border:none;">Sair</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="../scripts/script_progress.js"></script>
    <script>
        const wordDatabase = [
            { w: "biblioteca", h: "O santuário onde o silêncio guarda vozes impressas.", d: 1000 },
            { w: "manuscrito", h: "Um texto original, muitas vezes escrito à mão antes da prensa.", d: 1200 },
            { w: "metáfora", h: "Uma ponte invisível entre dois significados distintos.", d: 1500 },
            { w: "personagem", h: "A alma fictícia que caminha pelas linhas do autor.", d: 800 },
            { w: "antologia", h: "Um jardim onde florescem diversos autores em um só volume.", d: 1800 },
            { w: "pergaminho", h: "A pele do passado que carregava as leis e as artes.", d: 1400 },
            { w: "pseudonimo", h: "A máscara de letras que um autor usa para se esconder.", d: 1600 },
            { w: "soneto", h: "Quatorze versos que aprisionam um sentimento.", d: 1100 },
            { w: "epilogo", h: "As últimas palavras após o fim da tempestade.", d: 900 },
            { w: "cronica", h: "O retrato do cotidiano capturado em palavras.", d: 700 }
        ];

        let gameState = {};
        const records = { facil: 0, medio: 0, dificil: 0 };

        function normalize(str) {
            return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showMenu() { 
            updateRecordsUI();
            showScreen('menu-screen'); 
        }

        function updateRecordsUI() {
            // Carrega do localStorage para mostrar no menu
            records.facil = localStorage.getItem('versos_facil') || 0;
            records.medio = localStorage.getItem('versos_medio') || 0;
            records.dificil = localStorage.getItem('versos_dificil') || 0;
            
            document.getElementById('record-facil').innerText = records.facil;
            document.getElementById('record-medio').innerText = records.medio;
            document.getElementById('record-dificil').innerText = records.dificil;
        }

        function initGame(diff) {
            const randomWord = wordDatabase[Math.floor(Math.random() * wordDatabase.length)];
            gameState = {
                wordObj: randomWord,
                difficulty: diff,
                tries: 0,
                maxTries: diff === 'dificil' ? 5 : Infinity,
                guesses: [],
                hintRevealed: diff === 'facil' || diff === 'dificil'
            };

            document.getElementById('diff-label').innerText = "NÍVEL: " + diff.toUpperCase();
            document.getElementById('hint-text').innerText = gameState.hintRevealed ? randomWord.h : "A pista será revelada em breve...";
            updateTriesUI();
            document.getElementById('ranking-list').innerHTML = "";
            document.getElementById('guess-input').value = "";
            showScreen('game-screen');
        }

        function getSimilarity(input, secret) {
            if (input === secret) return 1000;
            const s1 = new Set(input);
            const s2 = new Set(secret);
            let common = 0;
            s1.forEach(l => { if(s2.has(l)) common++; });
            let score = (common / secret.length) * 500 + (input.length === secret.length ? 150 : 0);
            return Math.min(999, Math.floor(score + (Math.random() * 30)));
        }

        function handleGuess() {
            const inputField = document.getElementById('guess-input');
            const rawValue = inputField.value;
            const cleanValue = normalize(rawValue);
            const cleanSecret = normalize(gameState.wordObj.w);

            if (!cleanValue) return;
            if (gameState.guesses.some(g => normalize(g.word) === cleanValue)) {
                inputField.value = "";
                return;
            }

            gameState.tries++;
            const score = getSimilarity(cleanValue, cleanSecret);
            gameState.guesses.push({ word: rawValue, score: score });
            gameState.guesses.sort((a, b) => b.score - a.score);

            if (gameState.difficulty === 'medio' && score > 450) {
                gameState.hintRevealed = true;
                document.getElementById('hint-text').innerText = gameState.wordObj.h;
            }

            renderRanking();
            updateTriesUI();

            if (score === 1000) return endGame('win');
            if (gameState.tries >= gameState.maxTries) return endGame('lose');

            inputField.value = "";
            inputField.focus();
        }

        function giveUp() {
            endGame('gave_up');
        }

        function updateTriesUI() {
            const label = document.getElementById('tries-label');
            label.innerText = gameState.maxTries !== Infinity ? 
                `TENTATIVAS: ${gameState.tries}/${gameState.maxTries}` : `TENTATIVAS: ${gameState.tries}`;
        }

        function renderRanking() {
            const list = document.getElementById('ranking-list');
            list.innerHTML = "";
            gameState.guesses.forEach((g) => {
                const perc = (g.score / 1000) * 100;
                const item = document.createElement('div');
                item.className = `ranking-item ${g.score > 450 ? 'top-match' : ''}`;
                item.innerHTML = `
                    <div style="display:flex; justify-content:space-between; font-size:0.85rem">
                        <span><strong>${g.word}</strong></span>
                        <span>${g.score}</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${perc}%"></div></div>
                `;
                list.appendChild(item);
            });
        }

        function endGame(status) {
            showScreen('result-screen');
            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');
            const scoreVal = document.getElementById('final-score-val');
            const detail = document.getElementById('stats-detail');

            if (status === 'win') {
                title.innerText = "Obra Concluída";
                title.style.color = "var(--text-main)";
                const finalScore = Math.round(gameState.wordObj.d / gameState.tries);
                scoreVal.innerText = finalScore + " pts";
                desc.innerText = `Você desvendou: "${gameState.wordObj.w.toUpperCase()}"`;
                detail.innerText = `Eficiência: ${gameState.tries} tentativa(s).`;
                
                // Salvamento de Recordes
                let currentTotal = parseInt(localStorage.getItem('poefo_versos')) || 0;
                if (finalScore > currentTotal) localStorage.setItem('poefo_versos', finalScore);
                
                // Atualiza pontuação total no banco
                if (typeof incrementUserScore === 'function') {
                    incrementUserScore(finalScore).catch(() => saveUserProgressLocalFallback(finalScore, 0));
                } else {
                    saveUserProgressLocalFallback(finalScore, 0);
                }
                
                // Salva recorde por dificuldade também para a interface interna
                if (finalScore > (parseInt(localStorage.getItem('versos_'+gameState.difficulty)) || 0)) {
                    localStorage.setItem('versos_'+gameState.difficulty, finalScore);
                }
            } else {
                title.innerText = status === 'gave_up' ? "Escrita Abandonada" : "Rascunho Perdido";
                title.style.color = "var(--error)";
                scoreVal.innerText = "0 pts";
                desc.innerText = `A palavra secreta era: ${gameState.wordObj.w.toUpperCase()}`;
                detail.innerText = status === 'gave_up' ? "Você decidiu desistir desta investigação." : "Suas tentativas acabaram.";
            }
        }

        document.getElementById('guess-input').addEventListener('keypress', e => { if(e.key === 'Enter') handleGuess(); });
        updateRecordsUI();
    </script>
</body>
</html>
